name: Publicar na GGsistemas

# Publica o site (pasta dist/) no servidor da GGsistemas por FTP/FTPS.
# Configure em GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, FTP_SERVIDOR, FTP_USUARIO, FTP_SENHA
#   Variables: FTP_PASTA (ex.: /public_html/projetopenochao/ — confirme com a GGsistemas)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: publicar

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuração
        env:
          FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
          SUPA: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$FTP_SERVIDOR" ] || [ -z "$SUPA" ]; then
            echo "::error::Configure os secrets VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, FTP_SERVIDOR, FTP_USUARIO e FTP_SENHA (veja docs/INSTALACAO.md)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_PASTA || './' }}
