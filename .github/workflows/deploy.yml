name: Publicar site (GitHub Pages)

# Publica o site em https://projetopenochao.ggsistemas.dev.br
# Pré-requisito (uma vez): Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main, claude/sweet-maxwell-6butz2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Sem VITE_SUPABASE_*: gera a versão simples do site (sem sistema administrativo).
      - run: npm run build
      # O GitHub Pages não reescreve rotas: 404.html = index.html faz /doe e /contato funcionarem.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
