# Exemplo para servidor com Nginx (caso a GGsistemas use VPS em vez de cPanel/Apache).
# Coloque os arquivos de dist/ em /var/www/projetopenochao e o certificado via Certbot.
server {
    listen 80;
    server_name projetopenochao.ggsistemas.dev.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name projetopenochao.ggsistemas.dev.br;

    ssl_certificate     /etc/letsencrypt/live/projetopenochao.ggsistemas.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projetopenochao.ggsistemas.dev.br/privkey.pem;

    root /var/www/projetopenochao;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # rotas do aplicativo (React Router) → index.html
    location / { try_files $uri $uri/ /index.html; }
}
